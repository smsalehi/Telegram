name: Build Telegram XRay
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release with the arm64 APK"
        type: boolean
        default: true

permissions:
  contents: write

env:
  APP_VERSION_NAME: "12.10.5"
  RELEASE_TAG: "v12.10.5-xray1-arm64"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: xray-proxy
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/config/release.keystore
          ls -la TMessagesProj/config/release.keystore

      - name: Build standalone APK (arm64 only)
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleA64Standalone \
            -PnativeTarget=arm64-v8a \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ALIAS_PASS }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ALIAS_NAME }}" \
            --stacktrace

      - name: Rename APK
        run: |
          OUT=TMessagesProj_AppStandalone/build/outputs/apk
          mkdir -p dist
          mv "$OUT/a64/standalone/app.apk"   "dist/Telegram-XRay-${{ env.APP_VERSION_NAME }}-arm64.apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-XRay-${{ env.APP_VERSION_NAME }}-arm64
          path: dist/*.apk

      - name: Publish GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Telegram XRay ${{ env.APP_VERSION_NAME }} arm64
          files: dist/*.apk
          body: |
            Telegram ${{ env.APP_VERSION_NAME }} with built-in XRay (VLESS) proxy support.
            arm64-v8a only (most modern phones).

            Signed with a personal key — uninstall the official Telegram first if the package signature conflicts.
